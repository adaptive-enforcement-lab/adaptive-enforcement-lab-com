name: Export OpenTelemetry Traces to Dash0
on:
  workflow_run:
    workflows:
      - "Build Pipeline"
      - "Release Pipeline"
      - "Documentation Quality"
    types:
      - completed
jobs:
  export-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Export Workflow Trace
        uses: corentinmusard/otel-cicd-action@6022e68732c1cab4d2c8218b810f69006ee5cc34 # 4.1.0
        with:
          otlpEndpoint: ${{ secrets.DASH0_OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.DASH0_OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          runId: ${{ github.event.workflow_run.id }}
