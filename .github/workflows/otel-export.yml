name: Export OpenTelemetry Traces to Dash0
on:
  workflow_run:
    workflows:
      - "Build Pipeline"
      - "Release Pipeline"
      - "Documentation Quality"
    types:
      - completed
jobs:
  export-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Export Workflow Trace
        uses: corentinmusard/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # 4.2.0
        with:
          otlpEndpoint: ${{ secrets.DASH0_OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.DASH0_OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          runId: ${{ github.event.workflow_run.id }}
