name: Export OpenTelemetry Traces to Dash0
on:
  workflow_run:
    workflows:
      - "Build Pipeline"
      - "Release Pipeline"
      - "Documentation Quality"
    types:
      - completed
jobs:
  export-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Export Workflow Trace
        uses: corentinmusard/otel-cicd-action@f2d88ecf54d9dd3e01ea95e25f93603212ee93d3 # 4.0.1
        with:
          otlpEndpoint: ${{ secrets.DASH0_OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.DASH0_OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          runId: ${{ github.event.workflow_run.id }}
