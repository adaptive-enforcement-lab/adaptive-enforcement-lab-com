---
repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yml"]
        files: \.md$
        exclude: ^(CHANGELOG\.md|\.content-machine/.*|docs/includes/.*)$
  - repo: https://github.com/adaptive-enforcement-lab/readability
    rev: v3.1.2
    hooks:
      - id: readability-docs
        name: check documentation readability
  - repo: local
    hooks:
      - id: check-forbidden-tech
        name: block forbidden technologies
        entry: scripts/check-forbidden-tech.sh
        language: script
        files: \.(md|yaml|yml|sh|tf|Dockerfile|Containerfile)$
        pass_filenames: true
      - id: check-description
        name: check description frontmatter
        entry: scripts/check-description.sh
        language: script
        files: \.md$
        exclude: ^docs/includes/.*$
        pass_filenames: true
      - id: check-title
        name: check title frontmatter
        entry: scripts/check-title.sh
        language: script
        files: \.md$
        exclude: ^docs/includes/.*$
        pass_filenames: true
      - id: check-blog-not-howto
        name: block how-to content in blog posts
        entry: scripts/check-blog-not-howto.sh
        language: script
        files: ^docs/blog/posts/.*\.md$
        pass_filenames: true
      - id: check-blog-fold
        name: check blog excerpt marker and above-the-fold admonitions
        entry: scripts/check-blog-fold.sh
        language: script
        files: ^docs/blog/posts/.*\.md$
        pass_filenames: true
      - id: mkdocs-build
        name: mkdocs build
        entry: >-
          bash -c 'if [ -f .venv/bin/mkdocs ]; then
          .venv/bin/mkdocs build --strict; else
          mkdocs build --strict; fi'
        language: system
        pass_filenames: false
        files: \.(md|yml|yaml)$
